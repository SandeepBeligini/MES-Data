<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electoral Database Search Portal</title>
  <!-- Google Font: Inter / Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- PapaParse for Google Sheets CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --bg-color: #f6f9fc;
      --card-bg: #ffffff;
      --primary: #1a6dff;
      --primary-hover: #1255cc;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --input-border: #e2e8f0;
      --input-focus: #1a6dff;
      --clear-btn-bg: #e2e8f0;
      --clear-btn-hover: #cbd5e1;
      --clear-btn-text: #334155;
      --table-header-bg: #f8fafc;
      --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      /* Selection Lock */
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .container {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
    }

    /* Header Section */
    .header {
      margin-bottom: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.98rem;
      font-weight: 500;
    }

    /* Card Container */
    .card {
      background: var(--card-bg);
      padding: 28px 32px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    /* 3-Column Search Grid */
    .search-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      background-color: #ffffff;
      border: 1.5px solid var(--input-border);
      border-radius: 10px;
      font-size: 0.95rem;
      color: var(--text-dark);
      outline: none;
      transition: all 0.2s ease-in-out;
      -webkit-user-select: auto;
      user-select: auto;
    }

    .form-group input::placeholder {
      color: #94a3b8;
    }

    .form-group input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(26, 109, 255, 0.12);
    }

    /* Buttons */
    .btn-container {
      display: flex;
      gap: 12px;
    }

    .btn {
      height: 44px;
      padding: 0 28px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--clear-btn-bg);
      color: var(--clear-btn-text);
    }

    .btn-secondary:hover {
      background: var(--clear-btn-hover);
    }

    /* Results Table Card */
    .table-container {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      overflow-x: auto;
      max-height: 520px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
      cursor: default;
    }

    thead {
      position: sticky;
      top: 0;
      background: var(--table-header-bg);
      z-index: 2;
      border-bottom: 1.5px solid var(--border-color);
    }

    th {
      padding: 16px 20px;
      font-weight: 700;
      color: #334155;
      white-space: nowrap;
      font-size: 0.88rem;
    }

    td {
      padding: 16px 20px;
      border-bottom: 1px solid #edf2f7;
      color: var(--text-dark);
      white-space: nowrap;
      font-weight: 500;
    }

    tbody tr:hover {
      background-color: #f8fafc;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .no-data {
      padding: 44px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 500;
    }

    /* Responsive Design */
    @media (max-width: 900px) {
      .search-grid {
        grid-template-columns: 1fr;
      }
      .card {
        padding: 20px;
      }
      .header h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;" oncopy="return false;" oncut="return false;">

  <div class="container">
    <div class="header">
      <h1>Electoral Database Search Portal</h1>
      <p>Enter exact details in any field below to search records.</p>
    </div>

    <!-- Search Box Card -->
    <div class="card">
      <div class="search-grid">
        <div class="form-group">
          <label for="searchEpic">EPIC Number (Exact match)</label>
          <input type="text" id="searchEpic" placeholder="Enter exact EPIC Number..." onkeyup="checkEnter(event)" />
        </div>
        <div class="form-group">
          <label for="searchElector">Elector Name (Exact full name)</label>
          <input type="text" id="searchElector" placeholder="Enter exact full Elector Name..." onkeyup="checkEnter(event)" />
        </div>
        <div class="form-group">
          <label for="searchMobile">Mobile Number (Exact 10 digits)</label>
          <input type="text" id="searchMobile" placeholder="Enter exact Mobile Number..." onkeyup="checkEnter(event)" />
        </div>
      </div>

      <div class="btn-container">
        <button class="btn btn-primary" onclick="performSearch()">Search</button>
        <button class="btn btn-secondary" onclick="resetSearch()">Clear</button>
      </div>
    </div>

    <!-- Table Output Card -->
    <div class="table-container">
      <table id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
          <tr>
            <td class="no-data" colspan="100%">Loading database from Google Sheets...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const BASE_GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTvszZTFYORH06EEaEiOirIk9c7L2tf8KW_f_onGPXSbS5erFdYp7-_BtV_7JG5L5Ng-9gwyYCXyIOf/pub?output=csv";

    let rawRows = [];
    let allHeaders = [];
    let isInitialLoad = true;

    // Block keyboard copy/select shortcuts outside search inputs
    document.addEventListener("keydown", (e) => {
      const isInput = e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA";
      if (isInput && (e.key === "a" || e.key === "c" || e.key === "v" || e.key === "x") && (e.ctrlKey || e.metaKey)) {
        return;
      }
      if ((e.ctrlKey || e.metaKey) && ["c", "a", "u", "s", "p", "x"].includes(e.key.toLowerCase())) {
        e.preventDefault();
        return false;
      }
    });

    // Helper: Mask mobile number to show only last 4 digits
    function maskMobileNumber(val) {
      if (!val) return "";
      const strVal = String(val).replace(/\s+/g, "").trim();
      if (strVal.length > 4) {
        return "*".repeat(strVal.length - 4) + strVal.slice(-4);
      }
      return strVal;
    }

    // Clean text for exact comparison
    function normalizeText(val) {
      return String(val || "")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();
    }

    // Fetch Google Sheet data with cache busting
    function fetchDatabase(isBackgroundUpdate = false) {
      const cacheBustUrl = `${BASE_GOOGLE_SHEET_URL}&_t=${Date.now()}`;

      Papa.parse(cacheBustUrl, {
        download: true,
        header: false,
        skipEmptyLines: true,
        complete: function(results) {
          if (!results.data || results.data.length === 0) return;

          // Process and clean header names
          allHeaders = results.data[0].map(h => String(h || "").replace(/[\r\n]+/g, " ").trim());
          rawRows = results.data.slice(1);

          renderTableHead(allHeaders);

          if (isInitialLoad) {
            document.getElementById("tableBody").innerHTML = `<tr><td class="no-data" colspan="${allHeaders.length || 1}">Please enter exact search details above and click Search.</td></tr>`;
            isInitialLoad = false;
          } else {
            const qEpic    = document.getElementById("searchEpic").value.trim();
            const qElector = document.getElementById("searchElector").value.trim();
            const qMobile  = document.getElementById("searchMobile").value.trim();

            if (qEpic || qElector || qMobile) {
              performSearch();
            }
          }
        },
        error: function(err) {
          if (isInitialLoad) {
            document.getElementById("tableBody").innerHTML = `<tr><td class="no-data" colspan="100%">Error connecting to Google Sheets. Please ensure the link is public.</td></tr>`;
          }
          console.error("Fetch error:", err);
        }
      });
    }

    // Initial load
    window.addEventListener("DOMContentLoaded", () => {
      fetchDatabase(false);

      // Auto-refresh every 60 seconds
      setInterval(() => {
        fetchDatabase(true);
      }, 60000);
    });

    function renderTableHead(cols) {
      const thead = document.getElementById("tableHead");
      thead.innerHTML = `<tr>${cols.map(c => `<th>${c}</th>`).join("")}</tr>`;
    }

    function renderTableRows(rows) {
      const tbody = document.getElementById("tableBody");
      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td class="no-data" colspan="${allHeaders.length || 1}">No exact matching records found.</td></tr>`;
        return;
      }

      // Detect mobile column index
      const mobileColIndex = allHeaders.findIndex(h => h.toLowerCase().includes("mobile") || h.toLowerCase().includes("phone"));

      tbody.innerHTML = rows.map(row => {
        return `<tr>${allHeaders.map((_, colIndex) => {
          let cellVal = row[colIndex] !== undefined ? String(row[colIndex]).trim() : "";
          if (colIndex === mobileColIndex || (mobileColIndex === -1 && colIndex === 3)) {
            cellVal = maskMobileNumber(cellVal);
          }
          return `<td>${cellVal}</td>`;
        }).join("")}</tr>`;
      }).join("");
    }

    function checkEnter(event) {
      if (event.key === "Enter") {
        performSearch();
      }
    }

    function performSearch() {
      const rawEpic    = document.getElementById("searchEpic").value;
      const rawElector = document.getElementById("searchElector").value;
      const rawMobile  = document.getElementById("searchMobile").value;

      const qEpic    = normalizeText(rawEpic);
      const qElector = normalizeText(rawElector);
      const qMobile  = rawMobile.replace(/\D/g, "");

      if (!qEpic && !qElector && !qMobile) {
        document.getElementById("tableBody").innerHTML = `<tr><td class="no-data" colspan="${allHeaders.length || 1}">Please enter exact search details above and click Search.</td></tr>`;
        return;
      }

      let mobileIdx = allHeaders.findIndex(h => h.toLowerCase().includes("mobile") || h.toLowerCase().includes("phone"));
      if (mobileIdx === -1) mobileIdx = 3;

      const filtered = rawRows.filter(row => {
        // Elector Name in Column A (Index 0)
        let matchElector = true;
        if (qElector) {
          const colAVal = normalizeText(row[0]);
          matchElector = (colAVal === qElector);
        }

        // EPIC Number in Column E (Index 4)
        let matchEpic = true;
        if (qEpic) {
          const colEVal = normalizeText(row[4]);
          matchEpic = (colEVal === qEpic);
        }

        // Mobile Number in Mobile Column
        let matchMobile = true;
        if (qMobile) {
          const mobileVal = String(row[mobileIdx] || "").replace(/\D/g, "");
          matchMobile = (mobileVal.length > 0 && mobileVal === qMobile);
        }

        return matchElector && matchEpic && matchMobile;
      });

      renderTableRows(filtered);
    }

    function resetSearch() {
      document.getElementById("searchEpic").value = "";
      document.getElementById("searchElector").value = "";
      document.getElementById("searchMobile").value = "";

      document.getElementById("tableBody").innerHTML = `<tr><td class="no-data" colspan="${allHeaders.length || 1}">Please enter exact search details above and click Search.</td></tr>`;
    }
  </script>
</body>
</html>
